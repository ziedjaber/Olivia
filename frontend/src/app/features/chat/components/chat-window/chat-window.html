<div class="messenger-container">

  <!-- État vide : aucune conversation sélectionnée -->
  <div class="chat-empty" *ngIf="!activeConversation">
    <div class="chat-empty-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#E4E6EB" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.47715 2 2 6.1423 2 11.25C2 13.9482 3.32747 16.3768 5.41907 18.0076C5.556 18.1144 5.63756 18.2818 5.61741 18.4552L5.40552 20.2783C5.31497 21.0573 6.09632 21.6508 6.83733 21.3664L9.04944 20.518C9.17646 20.4693 9.31758 20.4682 9.44525 20.5057C10.2638 20.7454 11.1197 20.875 12 20.875C17.5228 20.875 22 16.7327 22 11.625C22 6.51731 17.5228 2.375 12 2.375V2Z" fill="#0084FF"/>
      </svg>
    </div>
    <p>Sélectionnez une conversation pour commencer</p>
  </div>

  <!-- Conversation active -->
  <ng-container *ngIf="activeConversation">

    <!-- HEADER -->
    <div class="messenger-header">
      <div class="header-left">
        <div class="avatar-wrapper">
          <img [src]="getOtherParticipantAvatar()" 
               alt="Avatar"
               (error)="onAvatarError($event)">
          <span class="status-badge" *ngIf="isOnline"></span>
        </div>
        
        <div class="header-info">
          <h3>{{ getOtherParticipantName() }}</h3>
          <p class="role-text" *ngIf="getOtherParticipantRole()">{{ getOtherParticipantRole() }}</p>
        </div>
      </div>

      <div class="header-right">
        <button class="icon-btn" title="Appel vocal">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#0084FF"><path d="M16.48 20.82c-4.48 0-9.28-2.6-12.03-5.22C1.59 12.74 -1.16 7.74 3.48 3.19c.47-.46 1.1-.73 1.76-.73.66 0 1.29.27 1.76.73l1.83 1.83c.89.89 1.05 2.22.45 3.3l-.68 1.25a.8.8 0 0 0 .14.93 16.58 16.58 0 0 0 5.64 5.65.8.8 0 0 0 .93.14l1.25-.68c1.08-.6 2.4-.44 3.3.45l1.83 1.83c.97.97.97 2.54 0 3.51-.9 1-2.93 3.42-5.21 3.42z"/></svg>
        </button>
        <button class="icon-btn" title="Appel vidéo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#0084FF"><path d="M17 10.5V7a2 2 0 0 0-2-2H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
        <button class="icon-btn close-btn" (click)="closeChat()" title="Fermer la conversation">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#0084FF" fill-rule="evenodd" clip-rule="evenodd"><path d="M12 10.586l4.95-4.95 1.414 1.414-4.95 4.95 4.95 4.95-1.414 1.414-4.95-4.95-4.95 4.95-1.414-1.414 4.95-4.95-4.95-4.95L7.05 5.636z"/></svg>
        </button>
      </div>
    </div>

    <!-- Zone des messages -->
    <div class="messenger-body">
      <app-message-bubble 
        *ngFor="let msg of messages" 
        [message]="msg"
        [isOwn]="isOwnMessage(msg)">
      </app-message-bubble>

      <div *ngIf="isTyping" class="messenger-typing">
        <div class="typing-bubble">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div #messagesEnd></div>
    </div>

    <!-- Champ de saisie -->
    <app-message-input 
      [conversationId]="activeConversation.id || ''" 
      [receiverId]="getOtherParticipantId()">
    </app-message-input>

  </ng-container>

</div>
