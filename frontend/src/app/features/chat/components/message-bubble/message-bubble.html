<div class="msg-wrapper" [class.own]="isOwn">

  <div *ngIf="!isOwn" class="msg-sender-name">
    {{ message.senderName }}
  </div>

  <div class="msg-row">
    <div class="msg-bubble">
      <div *ngIf="message.imageUrl" class="msg-image-container mb-2">
        <img [src]="getFullImageUrl(message.imageUrl)" 
             class="max-w-full rounded-lg cursor-pointer hover:opacity-90 transition-opacity"
             alt="Image partagée">
      </div>
      <p *ngIf="message.content">{{ message.content }}</p>
    </div>
  </div>

  <div class="msg-meta">
    <span class="msg-time">{{ formattedTime }}</span>
    <ng-container *ngIf="isOwn && showReadStatus">
      <span class="check-icon" [class.read]="message.read">
        {{ message.read ? '✓✓' : '✓' }}
      </span>
    </ng-container>
  </div>

</div>
