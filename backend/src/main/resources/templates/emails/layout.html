<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(62, 82, 25, 0.08);
            border: 1px solid rgba(62, 82, 25, 0.05);
        }
        
        .header {
            background: linear-gradient(135deg, #3e5219 0%, #2a3811 100%);
            padding: 48px 40px;
            text-align: center;
        }
        
        .header img {
            width: 80px;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
        }
        
        .header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        
        .content {
            padding: 48px 40px;
            color: #1a1a1a;
            line-height: 1.6;
        }
        
        .content h2 {
            font-size: 22px;
            font-weight: 800;
            color: #3e5219;
            margin-top: 0;
            margin-bottom: 16px;
        }
        
        .content p {
            font-size: 16px;
            color: #4a4a4a;
            margin-bottom: 24px;
        }
        
        .button {
            display: inline-block;
            background-color: #3e5219;
            color: #ffffff !important;
            padding: 16px 32px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 10px 20px rgba(62, 82, 25, 0.2);
            transition: all 0.3s ease;
        }
        
        .footer {
            background-color: #f1f3f0;
            padding: 32px 40px;
            text-align: center;
            border-top: 1px solid rgba(62, 82, 25, 0.05);
        }
        
        .footer p {
            font-size: 12px;
            color: #8c8c8c;
            margin: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: rgba(62, 82, 25, 0.1);
            color: #3e5219;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .stats-grid {
            background-color: #f8f9fa;
            border-radius: 24px;
            padding: 24px;
            margin: 24px 0;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .stat-item {
            margin-bottom: 16px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 900;
            color: #8c8c8c;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://cdn-icons-png.flaticon.com/512/11516/11516629.png" alt="Olivia Logo">
            <h1>Olivia Cooperative</h1>
        </div>
        
        <div class="content" th:insert="${content}">
            <!-- Content will be injected here -->
        </div>
        
        <div class="footer">
            <p>© 2026 Olivia Cooperative Management System</p>
            <p style="margin-top: 8px; opacity: 0.6;">Sustainability • Quality • Innovation</p>
        </div>
    </div>
</body>
</html>
